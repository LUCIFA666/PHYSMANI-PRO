<div id="ngff-actual-demo">
  <h3>物体动力学预测对比</h3>
  <div class="viz-controls">
    <label class="form-label">验证场景
      <select id="ngff-demo-scene" class="form-select" aria-label="选择验证场景"></select>
    </label>
    <button id="ngff-demo-play" class="btn btn-primary" type="button">播放 · 4 倍慢放</button>
    <span id="ngff-demo-checkpoint" class="text-small"></span>
  </div>
  <label class="form-label" for="ngff-demo-time">预测时间 <span id="ngff-demo-clock" class="tabular-nums">0.00 / 1.58 秒</span></label>
  <input id="ngff-demo-time" class="form-range" type="range" min="0" max="40" value="0" step="1" aria-label="预测时间轴">
  <div id="ngff-demo-objects" class="viz-row text-small" aria-label="物体颜色图例"></div>
  <div class="ngff-demo-views">
    <section><p class="text-center">真实仿真轨迹</p><canvas role="img" aria-label="真实仿真物体点云和地面">真实仿真轨迹</canvas></section>
    <section><p class="text-center">NGFF 预测</p><canvas role="img" aria-label="NGFF物体点云预测，灰点为真实位置">NGFF 预测轨迹</canvas></section>
    <section><p class="text-center">重力＋地面停止基线</p><canvas role="img" aria-label="重力与地面停止基线，灰点为真实位置">物理基线轨迹</canvas></section>
  </div>
  <div class="viz-row text-small"><span>空间坐标：仿真单位</span><span>灰点：真实位置</span><span>拖动任一视图可同步旋转</span></div>
  <p id="ngff-demo-instant" class="text-small tabular-nums"></p>
  <p id="ngff-demo-scores" class="text-small tabular-nums" aria-live="polite"></p>
  <script type="application/json" id="ngff-demo-data">__DATA__</script>
</div>
<style>
#ngff-actual-demo .ngff-demo-views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
#ngff-actual-demo .ngff-demo-views section{min-width:0}
#ngff-actual-demo .ngff-demo-views canvas{display:block;width:100%;touch-action:pan-y}
#ngff-actual-demo .ngff-object-mark{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px}
@media(max-width:600px){#ngff-actual-demo .ngff-demo-views{grid-template-columns:1fr;gap:0}}
</style>
<script>
(() => {
  const root = document.getElementById('ngff-actual-demo');
  const data = JSON.parse(document.getElementById('ngff-demo-data').textContent);
  const select = root.querySelector('#ngff-demo-scene');
  const play = root.querySelector('#ngff-demo-play');
  const range = root.querySelector('#ngff-demo-time');
  const clock = root.querySelector('#ngff-demo-clock');
  const instant = root.querySelector('#ngff-demo-instant');
  const scores = root.querySelector('#ngff-demo-scores');
  const legend = root.querySelector('#ngff-demo-objects');
  const canvases = [...root.querySelectorAll('canvas')];
  const methods = ['truth','ngff','baseline'];
  const names = {cloth:'布料',bowl:'碗',duck:'鸭子',rope:'绳子',panda:'熊猫',ball:'球',phone:'手机',can:'易拉罐',pillow:'枕头',miku:'初音模型'};
  const n = data.display_points_per_object;
  let sceneIndex = 0, frame = 0, yaw = -42 * Math.PI / 180, pitch = 23 * Math.PI / 180;
  let playing = false, startTime = 0, startFrame = 0, raf = null;
  let palette;

  function halfDecode(encoded) {
    const bytes = Uint8Array.from(atob(encoded), c => c.charCodeAt(0));
    const view = new DataView(bytes.buffer), out = new Float32Array(bytes.length/2);
    for(let i=0;i<out.length;i++) {
      const v=view.getUint16(i*2,true), sign=(v&32768)?-1:1, exponent=(v>>10)&31, fraction=v&1023;
      out[i]=exponent===0?sign*Math.pow(2,-14)*(fraction/1024):exponent===31?(fraction?NaN:sign*Infinity):sign*Math.pow(2,exponent-15)*(1+fraction/1024);
    }
    return out;
  }
  for(const s of data.scenes) {
    s.decoded = Object.fromEntries(methods.map(key=>[key,halfDecode(s.tracks[key])]));
    const option=document.createElement('option');
    option.value=String(data.scenes.indexOf(s));
    option.textContent=(s.kind==='typical'?'典型场景':'困难场景')+'：'+s.objects.map(x=>names[x]||x).join(' / ');
    select.appendChild(option);
  }
  range.max = String(data.frame_indices.length-1);
  root.querySelector('#ngff-demo-checkpoint').textContent='固定第 '+data.checkpoint_update+' 步最佳权重';

  function themeColor(token) {
    const probe=document.createElement('span');
    probe.style.color='var('+token+')';root.appendChild(probe);
    const value=getComputedStyle(probe).color;probe.remove();return value;
  }
  function refreshPalette() {
    palette={foreground:themeColor('--foreground'),muted:themeColor('--muted'),border:themeColor('--border'),
      series:[1,2,3].map(i=>themeColor('--viz-series-'+i))};
  }
  function rotate(x,y,z) {
    const horizontal=x*Math.cos(yaw)+y*Math.sin(yaw), away=-x*Math.sin(yaw)+y*Math.cos(yaw);
    return [horizontal,z*Math.cos(pitch)-away*Math.sin(pitch),away*Math.cos(pitch)+z*Math.sin(pitch)];
  }
  function drawPanel(canvas, key) {
    const scene=data.scenes[sceneIndex], width=canvas.parentElement.clientWidth, height=Math.round(width*1.03);
    if(width<1)return;
    const ratio=Math.min(2,window.devicePixelRatio||1), ctx=canvas.getContext('2d');
    canvas.style.height=height+'px';
    if(canvas.width!==Math.round(width*ratio)||canvas.height!==Math.round(height*ratio)){
      canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);
    }
    ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,width,height);
    const [low,high]=scene.bounds, mx=Math.max(.04,(high[0]-low[0])*.08),my=Math.max(.04,(high[1]-low[1])*.08);
    const floor=[[low[0]-mx,low[1]-my,-.94],[high[0]+mx,low[1]-my,-.94],[high[0]+mx,high[1]+my,-.94],[low[0]-mx,high[1]+my,-.94]];
    const corners=[];
    for(const x of [low[0]-mx,high[0]+mx])for(const y of [low[1]-my,high[1]+my])for(const z of [low[2],high[2]])corners.push(rotate(x,y,z));
    const minX=Math.min(...corners.map(x=>x[0])),maxX=Math.max(...corners.map(x=>x[0]));
    const minY=Math.min(...corners.map(x=>x[1])),maxY=Math.max(...corners.map(x=>x[1]));
    const scale=Math.min((width-34)/Math.max(.01,maxX-minX),(height-42)/Math.max(.01,maxY-minY));
    const map=p=>[width/2+(p[0]-(minX+maxX)/2)*scale,height/2-(p[1]-(minY+maxY)/2)*scale];
    function path(points) {
      ctx.beginPath();points.forEach((p,i)=>{const xy=map(rotate(...p));i?ctx.lineTo(...xy):ctx.moveTo(...xy);});
    }
    path([...floor,floor[0]]);ctx.fillStyle=palette.muted;ctx.globalAlpha=.55;ctx.fill();
    ctx.globalAlpha=1;ctx.strokeStyle=palette.border;ctx.lineWidth=1;ctx.stroke();
    for(const f of [.25,.5,.75]) {
      path([[floor[0][0]+(floor[1][0]-floor[0][0])*f,floor[0][1],-.94],[floor[0][0]+(floor[1][0]-floor[0][0])*f,floor[2][1],-.94]]);ctx.stroke();
      path([[floor[0][0],floor[0][1]+(floor[3][1]-floor[0][1])*f,-.94],[floor[1][0],floor[0][1]+(floor[3][1]-floor[0][1])*f,-.94]]);ctx.stroke();
    }
    const drawPoints=(track,ghost)=>{
      const points=[],offset=frame*3*n*3;
      for(let i=0;i<3*n;i++){
        const k=offset+i*3,p=rotate(track[k],track[k+1],track[k+2]),xy=map(p);
        points.push({x:xy[0],y:xy[1],depth:p[2],object:Math.floor(i/n)});
      }
      points.sort((a,b)=>a.depth-b.depth);
      ctx.globalAlpha=ghost?.22:.9;
      for(const p of points){ctx.fillStyle=ghost?palette.foreground:palette.series[p.object];ctx.beginPath();ctx.arc(p.x,p.y,ghost?1.1:1.8,0,Math.PI*2);ctx.fill();}
      ctx.globalAlpha=1;
    };
    if(key!=='truth')drawPoints(scene.decoded.truth,true);
    drawPoints(scene.decoded[key],false);
    ctx.strokeStyle=palette.foreground;ctx.fillStyle=palette.foreground;
    ctx.font=getComputedStyle(root).font;
    const origin=[low[0],low[1],-.94],length=Math.max(...high.map((v,i)=>v-low[i]))*.15;
    for(let axis=0;axis<3;axis++){
      const end=[...origin];end[axis]+=length;
      path([origin,end]);ctx.stroke();const xy=map(rotate(...end));
      ctx.fillText(['x','y','z'][axis],Math.max(5,Math.min(width-16,xy[0]+4)),Math.max(16,Math.min(height-6,xy[1]-4)));
    }
  }
  function redraw() {
    const scene=data.scenes[sceneIndex], time=data.frame_indices[frame]*data.dt;
    range.value=String(frame);clock.textContent=time.toFixed(2)+' / 1.58 秒';
    canvases.forEach((canvas,i)=>drawPanel(canvas,methods[i]));
    instant.textContent='当前帧 RMSE：NGFF '+scene.error_ngff[frame].toFixed(4)+' · 物理基线 '+scene.error_baseline[frame].toFixed(4);
  }
  function sceneDetails() {
    const scene=data.scenes[sceneIndex];select.value=String(sceneIndex);legend.replaceChildren();
    scene.objects.forEach((obj,i)=>{
      const span=document.createElement('span'),mark=document.createElement('span');
      mark.className='ngff-object-mark';mark.style.background='var(--viz-series-'+(i+1)+')';
      span.append(mark,document.createTextNode('物体 '+(i+1)+'：'+(names[obj]||obj)));legend.appendChild(span);
    });
    const m=scene.metrics.ngff,b=scene.metrics.baseline;
    scores.textContent='全轨迹（2048 点） · RMSE '+m.rmse.toFixed(4)+' / '+b.rmse.toFixed(4)+' · FPE '+m.fpe.toFixed(4)+' / '+b.fpe.toFixed(4)+'（NGFF / 基线）';
  }
  function stop() {playing=false;if(raf!==null)cancelAnimationFrame(raf);raf=null;play.textContent='播放 · 4 倍慢放';}
  function persist() {
    if(window.openai?.setWidgetState)window.openai.setWidgetState({
      modelContent:{checkpointUpdate:data.checkpoint_update,sceneSource:data.scenes[sceneIndex].source,frameIndex:data.frame_indices[frame],timeSeconds:data.frame_indices[frame]*data.dt},
      privateContent:{sceneIndex,frame,yaw,pitch}
    }).catch(()=>{});
  }
  function animate(now) {
    if(!playing)return;
    const start=data.frame_indices[startFrame]*data.dt, time=start+(now-startTime)/4000;
    while(frame<data.frame_indices.length-1&&data.frame_indices[frame+1]*data.dt<=time)frame++;
    redraw();
    if(frame===data.frame_indices.length-1){stop();persist();return;}
    raf=requestAnimationFrame(animate);
  }
  play.addEventListener('click',()=>{
    if(playing){stop();persist();return;}
    if(frame===data.frame_indices.length-1)frame=0;
    playing=true;startFrame=frame;startTime=performance.now();play.textContent='暂停';raf=requestAnimationFrame(animate);
  });
  range.addEventListener('input',()=>{stop();frame=Number(range.value);redraw();});
  range.addEventListener('change',persist);
  select.addEventListener('change',()=>{stop();sceneIndex=Number(select.value);frame=0;sceneDetails();redraw();persist();});
  for(const canvas of canvases){
    let dragging=null;
    canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;dragging=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);});
    canvas.addEventListener('pointermove',e=>{if(!dragging)return;yaw+=(e.clientX-dragging[0])*.008;pitch=Math.max(.08,Math.min(1.35,pitch+(e.clientY-dragging[1])*.008));dragging=[e.clientX,e.clientY];redraw();});
    canvas.addEventListener('pointerup',()=>{if(dragging){dragging=null;persist();}});
    canvas.addEventListener('pointercancel',()=>{dragging=null;});
  }
  function restore(saved) {
    const state=saved?.privateContent;
    if(!state)return;
    if(Number.isInteger(state.sceneIndex)&&state.sceneIndex>=0&&state.sceneIndex<data.scenes.length)sceneIndex=state.sceneIndex;
    if(Number.isInteger(state.frame)&&state.frame>=0&&state.frame<data.frame_indices.length)frame=state.frame;
    if(Number.isFinite(state.yaw))yaw=state.yaw;
    if(Number.isFinite(state.pitch))pitch=Math.max(.08,Math.min(1.35,state.pitch));
  }
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>{restore(event.detail?.globals?.widgetState);sceneDetails();redraw();});
  refreshPalette();sceneDetails();redraw();
  new ResizeObserver(redraw).observe(root);
  new MutationObserver(()=>{refreshPalette();redraw();}).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
})();
</script>
